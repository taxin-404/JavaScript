<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Counter — JavaScript Basics</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">JavaScript Basics</p>
      <h1>Counter</h1>
      <p class="hint">Use the buttons or the arrow keys to change the value.</p>
      <p class="count" id="count" aria-live="polite">0</p>
      <div class="actions">
        <button type="button" id="decrement" aria-label="Decrease counter">−</button>
        <button type="button" id="reset" class="reset">Reset</button>
        <button type="button" id="increment" aria-label="Increase counter">+</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
